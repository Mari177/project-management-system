<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Resources - PMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main">
            <div class="topbar" id="topbar"></div>

            <section class="section" id="resourceFormSection">
                <div class="section-header">
                    <h2 class="section-title">Create / Update Resource</h2>
                </div>

                <form id="resourceForm">
                    <input type="hidden" id="resourceId">

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Resource Name</label>
                            <input type="text" id="resourceName" required placeholder="Arun Kumar">
                        </div>

                        <div class="form-group">
                            <label>Designation</label>
                            <input type="text" id="designation" placeholder="Java Developer">
                        </div>

                        <div class="form-group">
                            <label>Department</label>
                            <select id="department">
                                <option value="Technical">Technical</option>
                                <option value="Functional">Functional</option>
                                <option value="QA">QA</option>
                                <option value="Management">Management</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Country</label>
                            <select id="country">
                                <option value="">Select Country</option>
                                <option value="INDIA">India</option>
                                <option value="UAE">UAE</option>
                                <option value="USA">USA</option>
                                <option value="UK">UK</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="location" placeholder="Example: Chennai">
                        </div>

                        <div class="form-group">
    <label>Linked Login Account (Optional)</label>
    <select id="appUserId">
        <option value="">No login account yet</option>
    </select>
</div>

                        <div class="form-group">
                            <label>Skill</label>
                            <input type="text" id="skill" placeholder="Java, Spring Boot, PostgreSQL">
                        </div>


                        <div class="form-group">
                            <label>Monthly Salary (INR)</label>
                            <input type="number" id="monthlySalary" placeholder="60000">
                        </div>

                        <div class="form-group">
                            <label>Status</label>
                            <select id="status">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit" id="saveResourceBtn">Save Resource</button>
                        <button class="btn btn-secondary" type="button" onclick="resetResourceForm()">Clear</button>
                    </div>
                </form>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">Resources List</h2>
                    <button class="btn btn-secondary" onclick="loadResources()">Refresh</button>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Resource</th>
                                <th>Designation</th>
                                <th>Department</th>
                                <th>Country</th>
                                <th>Location</th>
                                <th>Skill</th>
                                 <th>Mapped Login</th>
                                <th>Hourly Rate ($)</th>
                                <th>Status</th>
                                <th id="actionHeader">Action</th>
                            </tr>
                        </thead>
                        <tbody id="resourcesTable"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/resources.js"></script>

</body>

</html>
