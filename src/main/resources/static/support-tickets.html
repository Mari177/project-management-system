<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Support Tickets - PMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main">
            <div class="topbar" id="topbar"></div>

            <section class="section support-ticket-workspace">
                <div class="section-header">
                    <div>
                        <h2 class="section-title">Support Tickets</h2>
                        <p class="section-subtitle">
                            Track client support issues, requests, assignments, and resolution status.
                        </p>
                    </div>
                    <div class="form-actions compact-actions">
                        <button class="btn btn-secondary" type="button" onclick="window.location.href='/projects'">
                            Back to Projects
                        </button>
                        <button class="btn btn-secondary" type="button" onclick="reloadTickets()">
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="support-ticket-grid">
                    <div class="support-ticket-left">
                        <div class="timesheet-card support-selector-card">
                            <h3 class="timesheet-card-title">Support Project</h3>
                            <div class="form-group">
                                <label>Select Support Project</label>
                                <select id="supportProjectId" onchange="handleSupportProjectChange()">
                                    <option value="">Select Support Project</option>
                                </select>
                            </div>
                            <div id="supportProjectSummary" class="support-project-summary empty-state">
                                Select a support project to view tickets.
                            </div>
                        </div>

                        <div class="timesheet-card">
                            <h3 class="timesheet-card-title" id="ticketFormTitle">Create Support Ticket</h3>

                            <form id="supportTicketForm">
                                <input type="hidden" id="supportTicketId">

                                <div class="form-grid support-ticket-form-grid">
                                    <div class="form-group">
                                        <label>Ticket Type</label>
                                        <select id="ticketType">
                                            <option value="INCIDENT">Incident</option>
                                            <option value="SERVICE_REQUEST">Service Request</option>
                                            <option value="CHANGE_REQUEST">Change Request</option>
                                            <option value="ENHANCEMENT">Enhancement</option>
                                            <option value="QUESTION">Question</option>
                                            <option value="PROBLEM">Problem</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label>Priority</label>
                                        <select id="priority">
                                            <option value="P1">P1 - Production Down</option>
                                            <option value="P2">P2 - Major Issue</option>
                                            <option value="P3" selected>P3 - Normal Issue</option>
                                            <option value="P4">P4 - Low / Question</option>
                                        </select>
                                    </div>

                                    <div class="form-group internal-ticket-field">
                                        <label>Status</label>
                                        <select id="ticketStatus">
                                            <option value="NEW">NEW</option>
                                            <option value="ACKNOWLEDGED">ACKNOWLEDGED</option>
                                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                                            <option value="WAITING_FOR_CLIENT">WAITING_FOR_CLIENT</option>
                                            <option value="WAITING_FOR_INTERNAL">WAITING_FOR_INTERNAL</option>
                                            <option value="RESOLVED">RESOLVED</option>
                                            <option value="CLOSED">CLOSED</option>
                                            <option value="REOPENED">REOPENED</option>
                                            <option value="CANCELLED">CANCELLED</option>
                                        </select>
                                    </div>

                                    <div class="form-group internal-ticket-field">
                                        <label>Assign To</label>
                                        <select id="assignedResourceId">
                                            <option value="">Unassigned</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label>Module</label>
                                        <input type="text" id="moduleName" placeholder="Loan Workflow / Reports / Login">
                                    </div>

                                    <div class="form-group">
                                        <label>Environment</label>
                                        <select id="environment">
                                            <option value="PRODUCTION">Production</option>
                                            <option value="UAT">UAT</option>
                                            <option value="STAGING">Staging</option>
                                            <option value="DEVELOPMENT">Development</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label>Billing</label>
                                        <select id="ticketBillable">
                                            <option value="true">Billable</option>
                                            <option value="false">Non-Billable</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Title</label>
                                    <input type="text" id="ticketTitle" required placeholder="Short summary of the issue/request">
                                </div>

                                <div class="form-group">
                                    <label>Description</label>
                                    <textarea id="ticketDescription" rows="4" required
                                        placeholder="Explain issue, steps, expected result, actual result, screenshots reference, etc."></textarea>
                                </div>

                                <div class="form-group internal-ticket-field">
                                    <label>Root Cause</label>
                                    <textarea id="rootCause" rows="2" placeholder="Root cause after investigation"></textarea>
                                </div>

                                <div class="form-group internal-ticket-field">
                                    <label>Resolution Notes</label>
                                    <textarea id="resolutionNotes" rows="2" placeholder="Fix / workaround / deployment details"></textarea>
                                </div>

                                <div class="form-actions">
                                    <button class="btn btn-primary" type="submit" id="saveTicketBtn">
                                        Save Ticket
                                    </button>
                                    <button class="btn btn-secondary" type="button" onclick="resetTicketForm()">
                                        Clear
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="support-ticket-right">
                        <div class="support-ticket-summary-row" id="ticketSummaryRow">
                            <div class="report-metric">
                                <span>Total</span>
                                <strong id="totalTicketsCount">0</strong>
                            </div>
                            <div class="report-metric">
                                <span>Open</span>
                                <strong id="openTicketsCount">0</strong>
                            </div>
                            <div class="report-metric">
                                <span>Resolved</span>
                                <strong id="resolvedTicketsCount">0</strong>
                            </div>
                            <div class="report-metric">
                                <span>Closed</span>
                                <strong id="closedTicketsCount">0</strong>
                            </div>
                        </div>

                        <div id="supportTicketsList" class="support-ticket-list">
                            <div class="empty-state">
                                Select a support project to view tickets.
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/support-tickets.js"></script>

</body>

</html>
