<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clients - PMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar" id="topbar"></div>

        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Create / Update Client</h2>
            </div>

            <form id="clientForm">
                <input type="hidden" id="clientId">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="clientName" required placeholder="ABC Bank">
                    </div>

                    <div class="form-group">
                        <label>Contact Person</label>
                        <input type="text" id="contactPerson" placeholder="Ramesh">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="ramesh@abcbank.com">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone" placeholder="9876543210">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit" id="saveClientBtn">Save Client</button>
                    <button class="btn btn-secondary" type="button" onclick="resetClientForm()">Clear</button>
                </div>
            </form>
        </section>

        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Clients List</h2>
                <button class="btn btn-secondary" onclick="loadClients()">Refresh</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client</th>
                        <th>Contact Person</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="clientsTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/clients.js"></script>

</body>
</html>
