<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PMS Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div class="login-card">
    <h1 class="login-title">Project Management System</h1>
    <p class="login-subtitle">
        Localhost demo login for project, resource, milestone and cost tracking.
    </p>

    <form id="loginForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Login</button>

        <div id="loginError" class="error"></div>
    </form>
</div>

<script src="js/app.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
            const success = await PMS.login(username, password);

            if (!success) {
                document.getElementById("loginError").innerText = "Invalid username or password";
                return;
            }

            window.location.href = "/dashboard";
        } catch (error) {
            document.getElementById("loginError").innerText = "Login failed. Please check backend.";
        }
    });
</script>

</body>
</html>
